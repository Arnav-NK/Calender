<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Calendar</title>
    <!-- Use a Nothing-like dot matrix font and a clean sans-serif from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.remoat.dev/promoter/remoat-promoter.min.js"></script>
</head>

<body>
    <div class="app-container">
        <header class="calendar-header">
            <h1 class="month-display" id="monthDisplay">Month YYYY</h1>
            <div class="nav-buttons">
                <button id="todayBtn" class="btn">Today</button>
                <button id="prevBtn" class="btn icon-btn" aria-label="Previous Month">&larr;</button>
                <button id="nextBtn" class="btn icon-btn" aria-label="Next Month">&rarr;</button>
            </div>
        </header>

        <div class="weekdays">
            <div>SUN</div>
            <div>MON</div>
            <div>TUE</div>
            <div>WED</div>
            <div>THU</div>
            <div>FRI</div>
            <div>SAT</div>
        </div>

        <div class="calendar-grid" id="calendarGrid">
            <!-- Days will be generated by JS -->
        </div>
    </div>

    <!-- Modal for Notes -->
    <div id="noteModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalDateDisplay">Date</h2>
                <button id="closeModalBtn" class="btn icon-btn" aria-label="Close">&times;</button>
            </div>

            <div class="notes-list" id="notesList">
                <!-- Notes will be listed here -->
            </div>

            <div class="add-note-form">
                <input type="time" id="noteTime" class="input-field" required>
                <input type="text" id="noteText" class="input-field" placeholder="Add a note..." required>
                <button id="addNoteBtn" class="btn">Add</button>
            </div>
        </div>
    </div>

    <!-- Edit Note Modal -->
    <div id="editNoteModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Note</h2>
                <button id="closeEditModalBtn" class="btn icon-btn" aria-label="Close">&times;</button>
            </div>
            <div class="add-note-form">
                <input type="time" id="editNoteTime" class="input-field" required>
                <input type="text" id="editNoteText" class="input-field" required>
                <button id="saveEditNoteBtn" class="btn">Save</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
